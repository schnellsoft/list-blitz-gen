<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harbor Board loads a JSON list once, then serves it from the Cache API on every later visit."
    />
    <title>Harbor Board</title>
    <script>
      /* Preload JSON only when the Cache API has nothing yet.
         A static preload tag would fire a network request on every visit. */
      if ("caches" in window) {
        var dataUrl = new URL("data/items.json", document.baseURI);
        caches
          .open("harbor-board-v1")
          .then(function (cache) {
            return cache.match(dataUrl);
          })
          .then(function (hit) {
            if (hit) return;
            var link = document.createElement("link");
            link.rel = "preload";
            link.href = dataUrl.href;
            link.as = "fetch";
            link.crossOrigin = "anonymous";
            document.head.appendChild(link);
          });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
